<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/svg+xml" href="%sveltekit.assets%/favicon.svg" />
    <!--
      viewport-fit=cover : sans lui, env(safe-area-inset-*) vaut toujours 0 et
      la saisie du chat, les barres du bas et le bouton flottant ne peuvent pas
      s'ecarter de l'encoche ni de la barre d'accueil de l'iPhone.
      interactive-widget=resizes-content : sur Android, le clavier RETRECIT la
      page au lieu de la recouvrir ; la saisie du chat, collee en bas, reste
      au-dessus du clavier.
      Ni maximum-scale ni user-scalable=no : le zoom au doigt sert a lire les
      textes de loi et les pages PDF.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <!-- Couleur de la barre du navigateur mobile ; le script ci-dessous et
         src/lib/stores/theme.ts la passent au fond sombre en mode sombre. -->
    <meta name="theme-color" content="#f8f9fa" />
    <!--
      Theme pose AVANT le premier affichage : les pages arrivent rendues par le
      serveur, qui ne connait pas le choix (localStorage). Sans ce script, un
      utilisateur en mode sombre verrait la page en clair jusqu'au chargement
      du JavaScript (src/lib/stores/theme.ts, meme cle, meme logique).
    -->
    <script>
      try {
        var t = localStorage.getItem('jurix-theme');
        var d = t === 'dark' || (t === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
        var r = document.documentElement;
        r.classList.add(d ? 'dark' : 'light');
        r.setAttribute('data-theme', d ? 'dark' : 'light');
        if (d) document.querySelector('meta[name="theme-color"]').setAttribute('content', '#0a1628');
      } catch (e) {}
    </script>
    %sveltekit.head%
  </head>
  <!--
    Données ET code d'une page préchargés au survol (au toucher sur
    téléphone) : SvelteKit demande alors le code de la route en même temps
    que son __data.json (en cache chez Vercel), sans les enchaîner. Un
    data-sveltekit-preload-code="hover" n'y ajoutait donc rien.

    Pas de preload-code="viewport" : il téléchargerait ET exécuterait, juste
    après l'hydratation, le code de chaque route dont un lien est à l'écran
    (environ huit depuis l'en-tête, 40 à 60 Ko compressés), sur des
    téléphones modestes et des forfaits au mégaoctet, pour ne gagner que le
    téléchargement de ce code, déjà parallèle à celui des données, et
    seulement à la première visite de chaque route. S'il le faut un jour, le
    poser sur les seules listes de documents (vers /laws/[id], la route la
    plus lourde), pas ici.
  -->
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
