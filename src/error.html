<!doctype html>
<!--
  Page de dernier recours : SvelteKit la sert quand le rendu échoue AVANT
  +error.svelte (layout racine, hook handle, ou la page d'erreur elle-même).
  Sans elle, le visiteur recevait la page brute de SvelteKit, en anglais
  (« Internal Error »), sans aucun lien. Autonome : ni JavaScript, ni feuille de
  style externe, ni police — rien de ce qui vient d'échouer.
-->
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Erreur %sveltekit.status% — JuriX</title>
    <!--
      Couleurs du site (noir et blanc, échelle zinc de tailwind.config.js),
      écrites en clair : cette page ne charge aucune feuille de style. Mode
      sombre selon le système, faute du script de thème.
    -->
    <style>
      :root {
        color-scheme: light dark;
        --fond: #fafafa; /* background-light */
        --texte: #09090b; /* zinc-950 */
        --discret: #52525b; /* zinc-600, 7,4:1 sur le fond */
        --accent: #09090b;
        --trait: #d4d4d8; /* zinc-300, soulignement au repos */
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --fond: #09090b; /* background-dark */
          --texte: #f4f4f5; /* zinc-100 */
          --discret: #a1a1aa; /* zinc-400, 7,8:1 sur le fond */
          --accent: #ffffff;
          --trait: #52525b; /* zinc-600 */
        }
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px 16px;
        box-sizing: border-box;
        background: var(--fond);
        color: var(--texte);
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        text-align: center;
      }
      main {
        max-width: 28rem;
      }
      .statut {
        font-size: 4rem;
        font-weight: 800;
        letter-spacing: -0.025em;
        font-variant-numeric: tabular-nums;
        color: var(--accent);
        margin: 0 0 1rem;
      }
      h1 {
        font-size: 1.5rem;
        letter-spacing: -0.025em;
        margin: 0 0 0.75rem;
      }
      p {
        color: var(--discret);
        line-height: 1.5;
        margin: 0 0 2rem;
      }
      a {
        color: var(--accent);
        font-weight: 600;
        text-decoration: underline;
        text-decoration-color: var(--trait);
        text-underline-offset: 4px;
      }
      a:hover {
        text-decoration-color: var(--accent);
      }
      a:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 4px;
        border-radius: 2px;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="statut">%sveltekit.status%</p>
      <h1>Quelque chose s’est mal passé</h1>
      <p>%sveltekit.error.message%<br />Réessayez dans un instant. Si le problème persiste, revenez à l’accueil.</p>
      <a href="/">Retour à l’accueil</a>
    </main>
  </body>
</html>
