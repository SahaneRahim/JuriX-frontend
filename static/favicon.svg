<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background: Royal Blue Rounded Square -->
  <rect x="0" y="0" width="512" height="512" rx="110" fill="#2563EB"/>
  
  <!-- Icon: Scales of Justice (White) -->
  <g fill="none" stroke="white" stroke-width="24" stroke-linecap="round" stroke-linejoin="round">
    <!-- Center Post -->
    <line x1="256" y1="100" x2="256" y2="400" />
    <line x1="200" y1="400" x2="312" y2="400" /> <!-- Base -->

    <!-- Top Beam -->
    <line x1="128" y1="140" x2="384" y2="140" />
    
    <!-- Pivot Top -->
    <circle cx="256" cy="140" r="12" fill="white" stroke="none"/>

    <!-- Left Pan -->
    <path d="M128 140 L100 240" stroke-width="16"/>
    <path d="M128 140 L156 240" stroke-width="16"/>
    <path d="M100 240 A 40 20 0 0 0 156 240 Z" fill="white" stroke="none" opacity="0.2"/> <!-- Subtle fill -->
    <path d="M88 240 A 40 40 0 0 0 168 240" stroke-width="20" fill="none"/> <!-- Pan Bowl -->
    <line x1="88" y1="240" x2="168" y2="240" stroke-width="16"/>

    <!-- Right Pan -->
    <path d="M384 140 L356 240" stroke-width="16"/>
    <path d="M384 140 L412 240" stroke-width="16"/>
    <path d="M344 240 A 40 40 0 0 0 424 240" stroke-width="20" fill="none"/> <!-- Pan Bowl -->
    <line x1="344" y1="240" x2="424" y2="240" stroke-width="16"/>
  </g>
</svg>
