<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/svg+xml" href="%sveltekit.assets%/favicon.svg" />
    <!--
      viewport-fit=cover : sans lui, env(safe-area-inset-*) vaut toujours 0 et
      la saisie du chat, les barres du bas et le bouton flottant ne peuvent pas
      s'ecarter de l'encoche ni de la barre d'accueil de l'iPhone.
      interactive-widget=resizes-content : sur Android, le clavier RETRECIT la
      page au lieu de la recouvrir ; la saisie du chat, collee en bas, reste
      au-dessus du clavier.
      Ni maximum-scale ni user-scalable=no : le zoom au doigt sert a lire les
      textes de loi et les pages PDF.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <!-- Couleur de la barre du navigateur mobile, celle du fond de la page
         (background-light, #FAFAFA) ; le script ci-dessous et
         src/lib/stores/theme.ts la passent au fond sombre (#09090B) en mode
         sombre. Les trois valeurs doivent rester identiques. -->
    <meta name="theme-color" content="#FAFAFA" />
    <!--
      Theme pose AVANT le premier affichage : les pages arrivent rendues par le
      serveur, qui ne connait pas le choix (localStorage). Sans ce script, un
      utilisateur en mode sombre verrait la page en clair jusqu'au chargement
      du JavaScript (src/lib/stores/theme.ts, meme cle, meme logique).
    -->
    <script>
      try {
        var t = localStorage.getItem('jurix-theme');
        var d = t === 'dark' || (t === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
        var r = document.documentElement;
        r.classList.add(d ? 'dark' : 'light');
        r.setAttribute('data-theme', d ? 'dark' : 'light');
        if (d) document.querySelector('meta[name="theme-color"]').setAttribute('content', '#09090B');
      } catch (e) {}
    </script>
    %sveltekit.head%
  </head>
  <!--
    preload-code="viewport" : le code d'une page (JS et CSS de sa route) est
    chargé dès que l'un de ses liens est à l'écran, après l'hydratation ; le
    toucher n'attend plus que ses données (__data.json, en cache chez Vercel)
    au lieu d'enchaîner code puis données. Coût borné : une fois par route et
    non par lien (les 20 fiches d'une liste partagent le même code), des
    fichiers immuables mis en cache un an, et rien du tout quand le
    navigateur est en mode économie de données (SvelteKit coupe alors tout
    préchargement). Les données, elles, restent préchargées au survol (au
    toucher sur téléphone), comme avant.
  -->
  <body data-sveltekit-preload-data="hover" data-sveltekit-preload-code="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
