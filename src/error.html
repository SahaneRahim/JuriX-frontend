<!doctype html>
<!--
  Page de dernier recours : SvelteKit la sert quand le rendu échoue AVANT
  +error.svelte (layout racine, hook handle, ou la page d'erreur elle-même).
  Sans elle, le visiteur recevait la page brute de SvelteKit, en anglais
  (« Internal Error »), sans aucun lien. Autonome : ni JavaScript, ni feuille de
  style externe, ni police — rien de ce qui vient d'échouer.
-->
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Erreur %sveltekit.status% — JuriX</title>
    <style>
      :root {
        color-scheme: light dark;
        --fond: #f8f9fa;
        --texte: #1a1a1a;
        --discret: #6b7280;
        --accent: #2563eb;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --fond: #0a1628;
          --texte: #f1f5f9;
          --discret: #94a3b8;
          --accent: #60a5fa;
        }
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px 16px;
        box-sizing: border-box;
        background: var(--fond);
        color: var(--texte);
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        text-align: center;
      }
      main {
        max-width: 28rem;
      }
      .statut {
        font-size: 4rem;
        font-weight: 800;
        color: var(--accent);
        margin: 0 0 1rem;
      }
      h1 {
        font-size: 1.5rem;
        margin: 0 0 0.75rem;
      }
      p {
        color: var(--discret);
        line-height: 1.5;
        margin: 0 0 2rem;
      }
      a {
        color: var(--accent);
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="statut">%sveltekit.status%</p>
      <h1>Quelque chose s'est mal passé</h1>
      <p>%sveltekit.error.message%<br />Réessayez dans un instant. Si le problème persiste, revenez à l'accueil.</p>
      <a href="/">Retour à l'accueil</a>
    </main>
  </body>
</html>
